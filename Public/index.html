<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canivete Web - Multi Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h2 class="mb-4 text-center">Ferramentas de Mídia e Documentos</h2>

        <!-- Navegação das Abas -->
        <ul class="nav nav-tabs mb-4" id="toolTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" data-bs-toggle="tab" data-bs-target="#cutVideo" type="button">✂️ Cortar Vídeo</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#convertVideo" type="button">🔄 Converter Vídeo</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" data-bs-toggle="tab" data-bs-target="#pdfWord" type="button">📄 PDF para Word</button>
            </li>
        </ul>

        <!-- Conteúdo das Abas -->
        <div class="tab-content" id="toolTabsContent">
            
            <!-- ABA 1: CORTAR VÍDEO -->
            <div class="tab-pane fade show active" id="cutVideo">
                <div class="row">
                    <div class="col-md-7 mb-4">
                        <video id="videoPreview" class="w-100 rounded bg-dark mb-2" controls style="max-height: 350px;"></video>
                        <input type="file" class="form-control" id="videoFileCut" accept="video/*">
                    </div>
                    <div class="col-md-5">
                        <form id="cutForm" class="card card-body shadow-sm">
                            <label class="form-label fw-bold">1. Tempo (HH:MM:SS)</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text">Início</span>
                                <input type="text" class="form-control text-center" id="startTime" value="00:00:00" required>
                                <span class="input-group-text">Fim</span>
                                <input type="text" class="form-control text-center" id="endTime" value="00:00:30" required>
                            </div>
                            <label class="form-label fw-bold">2. Resolução</label>
                            <select class="form-select mb-3" id="resolution">
                                <option value="original">Manter Original</option>
                                <option value="1080">1080p</option>
                                <option value="720">720p</option>
                            </select>
                            <label class="form-label fw-bold">3. Pasta Destino</label>
                            <input type="text" class="form-control mb-4" id="outputDirCut" value="C:\Users\alcan\Videos\ffmpg result" required>
                            <button type="submit" class="btn btn-primary" id="btnCut">Processar Corte</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ABA 2: CONVERTER FORMATO DE VÍDEO -->
            <div class="tab-pane fade" id="convertVideo">
                <form id="convertVidForm" class="card card-body shadow-sm mx-auto" style="max-width: 600px;">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Selecione o Vídeo</label>
                        <input type="file" class="form-control" id="videoFileConvert" accept="video/*" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Converter Para:</label>
                        <select class="form-select" id="targetFormat">
                            <option value="mp4">.MP4 (Padrão Web)</option>
                            <option value="mkv">.MKV (Alta Qualidade)</option>
                            <option value="avi">.AVI (Legado)</option>
                            <option value="webm">.WEBM (Navegadores)</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Pasta Destino</label>
                        <input type="text" class="form-control" id="outputDirConvert" value="C:\Users\alcan\Videos\ffmpg result" required>
                    </div>
                    <button type="submit" class="btn btn-success" id="btnConvertVid">Converter Formato</button>
                </form>
            </div>

            <!-- ABA 3: PDF PARA WORD -->
            <div class="tab-pane fade" id="pdfWord">
                <form id="pdfForm" class="card card-body shadow-sm mx-auto" style="max-width: 600px;">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Selecione o PDF</label>
                        <input type="file" class="form-control" id="pdfFile" accept=".pdf" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Pasta Destino</label>
                        <input type="text" class="form-control" id="outputDirPdf" value="C:\Users\alcan\Videos\ffmpg result" required>
                    </div>
                    <button type="submit" class="btn btn-danger" id="btnPdf">Converter para Word</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script Controlador Unificado -->
    <script>
        // Preview de vídeo (Aba 1)
        document.getElementById('videoFileCut').addEventListener('change', function() {
            if (this.files[0]) document.getElementById('videoPreview').src = URL.createObjectURL(this.files[0]);
        });

        // Função genérica de envio via Fetch
        async function submitForm(url, formData, btnElement, loadingText, originalText) {
            btnElement.disabled = true;
            btnElement.innerText = loadingText;
            try {
                const response = await fetch(url, { method: 'POST', body: formData });
                const result = await response.json();
                if (response.ok) {
                    Swal.fire('Sucesso!', `Salvo em:<br><small>${result.path}</small>`, 'success');
                } else {
                    Swal.fire('Erro', result.error, 'error');
                }
            } catch (err) {
                Swal.fire('Erro', 'Falha na comunicação com o servidor.', 'error');
            } finally {
                btnElement.disabled = false;
                btnElement.innerText = originalText;
            }
        }

        // Submits
        document.getElementById('cutForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData();
            fd.append('video', document.getElementById('videoFileCut').files[0]);
            fd.append('startTime', document.getElementById('startTime').value);
            fd.append('endTime', document.getElementById('endTime').value);
            fd.append('resolution', document.getElementById('resolution').value);
            fd.append('outputDir', document.getElementById('outputDirCut').value);
            submitForm('/api/video/cut', fd, document.getElementById('btnCut'), 'Cortando...', 'Processar Corte');
        });

        document.getElementById('convertVidForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData();
            fd.append('video', document.getElementById('videoFileConvert').files[0]);
            fd.append('targetFormat', document.getElementById('targetFormat').value);
            fd.append('outputDir', document.getElementById('outputDirConvert').value);
            submitForm('/api/video/convert', fd, document.getElementById('btnConvertVid'), 'Convertendo...', 'Converter Formato');
        });

        document.getElementById('pdfForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData();
            fd.append('pdf', document.getElementById('pdfFile').files[0]);
            fd.append('outputDir', document.getElementById('outputDirPdf').value);
            submitForm('/api/pdf/convert', fd, document.getElementById('btnPdf'), 'Processando Python...', 'Converter para Word');
        });
    </script>
</body>
</html>
