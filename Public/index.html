<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canivete Web - Mídia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4 text-center">Edição de Vídeo</h2>
        
        <div class="row">
            <!-- Coluna do Player / Preview -->
            <div class="col-md-7 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <video id="videoPreview" class="w-100 rounded bg-dark" controls style="max-height: 400px;">
                            Seu navegador não suporta a tag de vídeo.
                        </video>
                        <div class="mt-3">
                            <input type="file" class="form-control" id="videoFile" accept="video/mp4,video/x-m4v,video/*">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna de Controles -->
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="cutForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">1. Definir Corte (HH:MM:SS)</label>
                                <div class="input-group">
                                    <span class="input-group-text">Início</span>
                                    <input type="text" class="form-control text-center" id="startTime" value="00:00:00" placeholder="00:00:00" pattern="[0-9]{2}:[0-9]{2}:[0-9]{2}" required>
                                    <span class="input-group-text">Fim</span>
                                    <input type="text" class="form-control text-center" id="endTime" value="00:00:30" placeholder="00:00:30" pattern="[0-9]{2}:[0-9]{2}:[0-9]{2}" required>
                                </div>
                                <small class="text-muted d-block mt-1">Exemplo: para 1 minuto e meio, digite 00:01:30</small>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">2. Resolução de Saída</label>
                                <select class="form-select" id="resolution">
                                    <option value="original">Manter Original (Rápido, sem perda)</option>
                                    <option value="1080">Full HD (1080p)</option>
                                    <option value="720">HD (720p - Ideal para WhatsApp)</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">3. Pasta de Destino</label>
                                <input type="text" class="form-control" id="outputDir" value="C:\Users\alcan\Videos\ffmpg result" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" id="btnProcessar">Processar e Cortar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const videoFile = document.getElementById('videoFile');
        const videoPreview = document.getElementById('videoPreview');
        const cutForm = document.getElementById('cutForm');
        const btnProcessar = document.getElementById('btnProcessar');

        // Pré-visualização instantânea do vídeo
        videoFile.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoPreview.src = fileURL;
            }
        });

        // Disparo do formulário
        cutForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const file = videoFile.files[0];
            if (!file) {
                return Swal.fire('Aviso', 'Selecione um vídeo primeiro.', 'warning');
            }

            const formData = new FormData();
            formData.append('video', file);
            formData.append('startTime', document.getElementById('startTime').value);
            formData.append('endTime', document.getElementById('endTime').value);
            formData.append('resolution', document.getElementById('resolution').value);
            formData.append('outputDir', document.getElementById('outputDir').value);

            btnProcessar.disabled = true;
            btnProcessar.innerText = 'Processando...';

            try {
                const response = await fetch('/api/video/cut', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    Swal.fire('Concluído!', `Vídeo salvo em:<br><small>${result.path}</small>`, 'success');
                } else {
                    Swal.fire('Erro', result.error, 'error');
                }
            } catch (error) {
                Swal.fire('Erro', 'Falha na comunicação com o servidor.', 'error');
            } finally {
                btnProcessar.disabled = false;
                btnProcessar.innerText = 'Processar e Cortar';
            }
        });
    </script>
</body>
</html>
